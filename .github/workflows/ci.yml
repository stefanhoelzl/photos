# What gates a merge. Deliberately NOT `bash .ship/gates.sh`: the local gate and this file
# check the same things today, but they answer to different pressures -- the gate to how fast
# an inner loop can stay, this to what a cold runner can prove -- so they are free to diverge.
name: ci

on:
  # Every push to every branch, so a branch is checked before anyone opens a PR for it. A PR's
  # required checks are matched by commit and job name, so the push run on its head satisfies
  # them. On main this is also what fills the cache: `gradle/actions/setup-gradle` writes its
  # Gradle home cache from the default branch alone and reads it everywhere else.
  #
  # Deliberately NOT also `pull_request`. That would run everything twice for every PR from a
  # branch here, and skipping the duplicate is not an option: a skipped job reports a passing
  # check, so a PR's skipped `build` would satisfy the ruleset while the push run was failing.
  # The cost is that a PR from a fork gets no checks at all and so cannot merge -- which fails
  # closed, and a fork's pushes are what a maintainer would re-push from here anyway.
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 25 to match gradle/libs.versions.toml, so foojay has nothing to provision.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # The Kotlin/Native distribution and its bundled gcc 8.3.0 / glibc 2.19 toolchain --
      # ~2 GB on a cold runner, and the single longest thing before a first compile.
      - name: Cache the Kotlin/Native distribution
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # The imaging prefix and the host tools that build it. Not all of `.tools`: the
      # intermediate build trees and the fetched tarballs are 730 MB that a warm run never
      # reads, because `$PREFIX/.stamp` is what makes each stage skip. cmake and nasm are
      # guarded by `[ ! -x .tools/bin/<tool> ]` and nasm is compiled, so both are carried.
      #
      # No `restore-keys`, deliberately. Every pinned version lives in build-native.sh, so a
      # near-miss key would restore stamps claiming a stage is built at a version the script
      # no longer asks for -- and the stage would skip instead of rebuilding. Exact match or
      # build it cold.
      - name: Cache the native imaging prefix
        uses: actions/cache@v4
        with:
          path: |
            .tools/bin
            .tools/cmake
            .tools/nasm
            .tools/native/konan
            .tools/s3mock-*-exec.jar
          key: native-${{ runner.os }}-${{ hashFiles('Scripts/build-native.sh') }}

      # build-native.sh needs konan's gcc toolchain to already be on disk and exits 1 if it
      # is not. COMPILING a linuxX64 target is what fetches it -- the compiler's own one-time
      # "Downloading native dependencies (LLVM, sysroot etc)" pulls the gcc/glibc-2.19
      # crosstool down before it compiles anything. Deliberately not a link: every linuxX64
      # binary here, `:domain`'s own test binary included, links SQLDelight's native driver
      # against the -lsqlite3 that lives in the prefix the NEXT step builds.
      - name: Fetch konan's gcc toolchain
        run: ./gradlew :domain:compileKotlinLinuxX64

      - name: Build the native imaging prefix
        run: Scripts/build-native.sh

      - name: Build and test
        run: ./gradlew build

      # Excluded from `build` on purpose, so it is asked for by name.
      - name: End-to-end scenarios
        run: ./gradlew :tests:cli:e2e

      # What ships. `dist` strips the release binary the two steps above already linked and
      # tested, and drops Kotlin/Native's `.kexe` suffix.
      - name: Package the binary
        run: ./gradlew :app:cli:dist

      # Last, and deliberately without `if: always()`: an artifact means the binary passed
      # everything, so a red run leaves none behind. The zip loses the exec bit -- `chmod +x`
      # after unzipping.
      - name: Upload photos-cli
        uses: actions/upload-artifact@v7
        with:
          name: photos-cli-linux-x64
          path: app/cli/build/dist/photos-cli
          retention-days: 7
          # By here the run is green, so the binary provably exists. No file means the path is
          # wrong, and that should be loud rather than a warning nobody reads.
          if-no-files-found: error

  # The media the app suites sync, and nothing else -- so the iOS scenarios wait minutes for it
  # rather than for the whole of `build`, which writes the same files for the desktop suite. No
  # Mac can run the linuxX64 generator, so the iOS suite gets these exact files from here: one
  # generator, byte-identical media on both platforms. The generator links against the imaging
  # prefix, so this job needs the same toolchain and prefix `build` does, from the same caches.
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache the Kotlin/Native distribution
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # The same paths and key as `build`'s, for the reasons given there.
      - name: Cache the native imaging prefix
        uses: actions/cache@v4
        with:
          path: |
            .tools/bin
            .tools/cmake
            .tools/nasm
            .tools/native/konan
            .tools/s3mock-*-exec.jar
          key: native-${{ runner.os }}-${{ hashFiles('Scripts/build-native.sh') }}

      # See `build`: compiling a linuxX64 target is what fetches the toolchain the prefix needs.
      - name: Fetch konan's gcc toolchain
        run: ./gradlew :domain:compileKotlinLinuxX64

      - name: Build the native imaging prefix
        run: Scripts/build-native.sh

      - name: Write the fixture media
        run: ./gradlew :tests:fixtures:fixtureMedia

      - name: Upload the app suites' fixture media
        uses: actions/upload-artifact@v7
        with:
          name: fixture-media
          path: tests/fixtures/build/fixture-media
          retention-days: 1
          if-no-files-found: error

  # The phone (DESIGN §6). A second job rather than more steps on the first: nothing here needs
  # the imaging prefix or the Linux toolchain, and the two run at once instead of in sequence.
  #
  # This repo is PUBLIC, so macOS minutes are free -- and every branch's push reaches this job.
  # It therefore holds no certificate and signs nothing: the archive and the TestFlight upload
  # are a separate workflow that runs only on `main`.
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native again, and a different distribution from the Linux job's: `runner.os` is
      # in the key, so the two caches never collide.
      - name: Cache the Kotlin/Native distribution
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # §3's open question, answered every run: the catalog rules execute against **iOS's own
      # SQLite** rather than the pinned one the CLI links. `:app:domain` brings the model, the
      # scheduler and the cache, compiled for the same target; `:ui` holds only composables and
      # so has nothing to run, but it still has to compile.
      - name: Catalog and app-domain suites on the simulator
        run: >-
          ./gradlew
          :domain:iosSimulatorArm64Test
          :app:domain:iosSimulatorArm64Test
          :adapter:ios:iosSimulatorArm64Test
          :ui:compileKotlinIosSimulatorArm64

      # What the Gradle build cannot see. The framework compiling proves the Kotlin; it says
      # nothing about the Info.plist, the Run Script phase, the asset catalog or the Swift entry
      # point -- and those fail at archive time, on main, where the upload gates. Building for a
      # simulator destination exercises all four and needs no certificate, which is what makes
      # it safe to run on every branch at all.
      - name: Build the app for a simulator
        run: >-
          xcodebuild build
          -project app/ios/Photos.xcodeproj
          -scheme Photos
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO

  # The app's scenarios against the signed Debug app on a simulator (`:tests:ios`). Its own job,
  # so the compile and simulator unit tests above still run beside the Linux job rather than
  # waiting for it. This one waits only for `fixtures`, and then runs beside `build` too.
  #
  # Safe on every branch for the same reason the job above is: the app is signed ad-hoc
  # for the simulator, which needs no certificate, and nothing here reads a secret.
  ios-e2e:
    runs-on: macos-26
    needs: fixtures
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache the Kotlin/Native distribution
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Download the fixture media
        uses: actions/download-artifact@v8
        with:
          name: fixture-media
          path: .fixture-media

      # Fails rather than skips when anything it needs is missing -- a simulator, the media,
      # S3Mock -- so a green check here means the scenarios really ran.
      - name: App scenarios on the simulator
        run: ./gradlew :tests:ios:e2e -Pphotos.fixtureMedia=.fixture-media

      # Whatever happened: a failing scenario's last frame is the first thing worth looking at.
      - name: Upload the scenario screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-scenario-screenshots
          path: tests/ios/build/scenarios/**/*.png
          retention-days: 7
          if-no-files-found: warn
