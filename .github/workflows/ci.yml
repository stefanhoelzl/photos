# What gates a merge. Deliberately NOT `bash .ship/gates.sh`: the local gate and this file
# check the same things today, but they answer to different pressures -- the gate to how fast
# an inner loop can stay, this to what a cold runner can prove -- so they are free to diverge.
name: ci

on:
  # Every push to every branch, so a branch is checked before anyone opens a PR for it. A PR's
  # required checks are matched by commit and job name, so the push run on its head satisfies
  # them. On main this is also what fills the cache: `gradle/actions/setup-gradle` writes its
  # Gradle home cache from the default branch alone and reads it everywhere else. That cache
  # carries the build cache too, which is where `:native`'s libraries come from on a warm run:
  # a branch that changes no native input restores them instead of compiling ffmpeg.
  #
  # Deliberately NOT also `pull_request`. That would run everything twice for every PR from a
  # branch here, and skipping the duplicate is not an option: a skipped job reports a passing
  # check, so a PR's skipped `build` would satisfy the ruleset while the push run was failing.
  # The cost is that a PR from a fork gets no checks at all and so cannot merge -- which fails
  # closed, and a fork's pushes are what a maintainer would re-push from here anyway.
  push:

# A newer push to a branch supersedes the run on the older one: nobody merges the older commit,
# and its macOS jobs hold slots out of the ~5 an account gets at once -- measured as `ios-e2e`
# queueing 5-6 minutes while pushes from several branches overlapped. Never on `main`, whose
# runs are what write the caches every branch reads.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 25 to match gradle/libs.versions.toml and gradle/gradle-daemon-jvm.properties, so neither
      # the compile toolchain nor the daemon has anything to provision.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # The Kotlin/Native distribution -- ~2 GB on a cold runner, and the single longest thing
      # before a first compile. The gcc toolchain the native libraries build with is not in
      # here: `:native` resolves its own pinned copy through Gradle.
      - name: Cache the Kotlin/Native distribution
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Without iOS klib cross-compilation: on by default, it compiles every iOS module on Linux
      # -- ~85 tasks -- that the `ios` job compiles again on a Mac, where it can also link and run
      # them. Here that is only time. The Linux jobs pass it to every Gradle call alike, so
      # none of them builds a task graph the others did not.
      - name: Build and test
        run: ./gradlew build -Pkotlin.native.enableKlibsCrossCompilation=false

      # A failing test's full stack trace. The log carries the first frame in the test class and no
      # more, which for a failure inside `runTest` is the line the test starts on.
      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux
          path: "**/build/test-results/**/*.xml"
          retention-days: 7
          if-no-files-found: ignore

      # Excluded from `build` on purpose, so it is asked for by name.
      - name: End-to-end scenarios
        run: ./gradlew :tests:cli:e2e -Pkotlin.native.enableKlibsCrossCompilation=false

      # The desktop viewer over what that same binary syncs (§11). After the CLI's scenarios, so
      # the release link they needed is already done.
      - name: Desktop viewer scenarios
        run: ./gradlew :tests:desktop:e2e -Pkotlin.native.enableKlibsCrossCompilation=false

      # What ships. `dist` strips the release binary the two steps above already linked and
      # tested, and drops Kotlin/Native's `.kexe` suffix.
      - name: Package the binary
        run: ./gradlew :app:cli:dist -Pkotlin.native.enableKlibsCrossCompilation=false

      # Last, and deliberately without `if: always()`: an artifact means the binary passed
      # everything, so a red run leaves none behind. The zip loses the exec bit -- `chmod +x`
      # after unzipping.
      - name: Upload photos-cli
        uses: actions/upload-artifact@v7
        with:
          name: photos-cli-linux-x64
          path: app/cli/build/dist/photos-cli
          retention-days: 7
          # By here the run is green, so the binary provably exists. No file means the path is
          # wrong, and that should be loud rather than a warning nobody reads.
          if-no-files-found: error

  # The media the app suites sync, and nothing else -- so the iOS scenarios wait minutes for it
  # rather than for the whole of `build`, which writes the same files for the desktop suite. No
  # Mac can run the linuxX64 generator, so the iOS suite gets these exact files from here: one
  # generator, byte-identical media on both platforms. The generator links the native libraries,
  # which it gets the way `build` does: from the Gradle build cache when main has built them.
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache the Kotlin/Native distribution
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Write the fixture media
        run: ./gradlew :tests:fixtures:fixtureMedia -Pkotlin.native.enableKlibsCrossCompilation=false

      - name: Upload the app suites' fixture media
        uses: actions/upload-artifact@v7
        with:
          name: fixture-media
          path: tests/fixtures/build/fixture-media
          retention-days: 1
          if-no-files-found: error

  # The phone (DESIGN §6). A job of its own rather than more steps on `build`: nothing here needs
  # the imaging prefix or the Linux toolchain, and the two run at once instead of in sequence.
  #
  # ONE macOS job, not a unit-test job beside a scenario job. Both need a simulator, and a fresh
  # runner's first boot is the costliest thing either does -- measured as the first scenario
  # spending 4-6 minutes in boot, terminate and uninstall while the device settled. Here the unit
  # tests run on that device first and take the settling, and each push holds one of the ~5 macOS
  # slots an account gets instead of two.
  #
  # This repo is PUBLIC, so macOS minutes are free -- and every branch's push reaches this job.
  # It therefore holds no certificate and signs nothing: the archive and the TestFlight upload
  # are a separate workflow that runs only on `main`. The app is signed ad-hoc for the simulator,
  # which needs no certificate, and nothing here reads a secret.
  #
  # Deliberately NOT `needs: fixtures`, though the scenarios need the media: everything before
  # them does not, and takes longer than the whole `fixtures` job. The job waits for the media
  # only once the app is built.
  ios:
    runs-on: macos-26
    permissions:
      contents: read
      # To read the `fixtures` job's state from this run while waiting for it.
      actions: read
    env:
      # The one device the unit tests and the scenarios share.
      PHOTOS_SIM_DEVICE: iPhone 17 Pro
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native again, and a different distribution from the Linux job's: `runner.os` is
      # in the key, so the two caches never collide.
      #
      # This job is the ONLY writer of the macOS entry; the ssh-runner sessions restore it and
      # never save. Beyond the distribution, `~/.konan` holds the per-library static caches
      # Kotlin/Native builds for each target it links debug binaries for, and those are what cost
      # a cold build: measured 2026-09-18, the iosArm64 set took ~8 of a 10-minute device archive,
      # where rerunning every task took 65 s. So whatever this job links is what every other
      # macOS consumer gets warm.
      #
      # `actions/cache` never re-saves a key it already has, so a new target linked here reaches
      # the cache only when the key changes. `-device-` is that change -- it marks the entry
      # that carries iosArm64 as well as the simulator. Rename it again if the set changes.
      - name: Cache the Kotlin/Native distribution
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-device-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-device-

      # Waited for here, alone. Booted while something compiled, it took the 3-core runner's
      # compile from 2m19s to 8m48s -- measured -- for 2.7 minutes of boot saved.
      - name: Boot the simulator
        run: |
          xcrun simctl boot "$PHOTOS_SIM_DEVICE"
          xcrun simctl bootstatus "$PHOTOS_SIM_DEVICE" -b

      # §3's open question, answered every run: the catalog rules execute against **iOS's own
      # SQLite** rather than the pinned one the CLI links. `:app:domain` brings the model, the
      # scheduler and the cache, compiled for the same target; `:ui:shared` and `:ui:phone` hold
      # only composables and so have nothing to run, but they still have to compile. `photos.simulator` runs them on the
      # booted device instead of a standalone boot per test binary.
      - name: Catalog and app-domain suites on the simulator
        run: >-
          ./gradlew
          :domain:iosSimulatorArm64Test
          :app:domain:iosSimulatorArm64Test
          :adapter:ios:iosSimulatorArm64Test
          :ui:shared:compileKotlinIosSimulatorArm64
          :ui:phone:compileKotlinIosSimulatorArm64
          "-Pphotos.simulator=$PHOTOS_SIM_DEVICE"

      # The phone's Debug framework, which nothing else here builds: the simulator steps never
      # touch iosArm64. Linked here for the cache step's sake -- so the device's Kotlin/Native
      # caches land in the entry this job saves -- and because it proves the framework the device
      # build embeds still links, on every branch rather than first on a phone.
      - name: Link the device framework
        run: ./gradlew :app:ios-debug:linkDebugFrameworkIosArm64

      # What the Gradle build cannot see as well as what the scenarios install. The framework
      # compiling proves the Kotlin; it says nothing about the Info.plist, the Run Script phase,
      # the asset catalog or the Swift entry point -- and those fail at archive time, on main,
      # where the upload gates. `build-for-testing` for a simulator exercises all four, plus the
      # UI test runner, and needs no certificate.
      - name: Build the signed Debug app
        run: ./gradlew :tests:ios:iosApp

      # What `needs: fixtures` would do, but only from here on. `filter=latest` so a re-run of
      # this job alone finds the earlier attempt's `fixtures` rather than none. A `fixtures` that
      # failed fails this job too: without the media there is nothing it can prove.
      - name: Wait for the fixture media
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while :; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest" \
              --jq '.jobs[] | select(.name == "fixtures") | "\(.status) \(.conclusion)"')
            case "$state" in
              "completed success") break ;;
              completed*) echo "::error::the fixtures job ended $state"; exit 1 ;;
            esac
            sleep 10
          done

      - name: Download the fixture media
        uses: actions/download-artifact@v8
        with:
          name: fixture-media
          path: .fixture-media

      # The app's scenarios against the signed Debug app on the simulator (`:tests:ios`). Fails
      # rather than skips when anything it needs is missing -- a simulator, the media, S3Mock --
      # so a green check here means the scenarios really ran.
      # `-x iosApp` because an earlier step built it, and the task has no outputs Gradle
      # could find up to date -- without it, xcodebuild would run a second time.
      - name: App scenarios on the simulator
        run: ./gradlew :tests:ios:e2e -x :tests:ios:iosApp -Pphotos.fixtureMedia=.fixture-media

      # Whatever happened: a failing scenario's last frame is the first thing worth looking at, and
      # the log of any UI test it started -- the alert-tapper's especially -- the second.
      - name: Upload the scenario screenshots and UI test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-scenario-screenshots
          path: |
            tests/ios/build/scenarios/**/*.png
            tests/ios/build/scenarios/**/*.log
          retention-days: 7
          if-no-files-found: warn
