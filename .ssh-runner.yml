# ssh-runner: a warm macOS box to build and test on, since DESIGN §"Remaining unknowns"
# names two things that need Apple hardware (the Compose grid at scroll speed, and the
# platform SQLite iOS ships). Generated workflows live in .github/workflows/ssh-runner-*.yml
# and are owned by the skill -- edit this file and re-run `init`, never those.
name: macos
runs-on: macos-26            # arm64, Xcode preinstalled. On a PRIVATE repo macOS bills at 10x.
checkout: true
stop-after: 90
idle-timeout: 20

steps:
  # 25 to match gradle/libs.versions.toml, so foojay has nothing to provision per session.
  - uses: actions/setup-java@v6
    with:
      distribution: temurin
      java-version: "25"

  # Gradle user home (dependency cache + wrapper dist), read but never written. Sessions are
  # dispatched against `main`, which setup-gradle treats as the default branch and so would
  # save ~550 MB of session-specific Gradle home to main every time -- crowding the repo's
  # 10 GB cache and evicting the entries CI actually needs. CI's `main` runs fill it instead.
  #
  # The session's own job has never saved an entry worth having, so it restores the `ios` CI
  # job's instead: setup-gradle keys its entry by job name, and this override is what its restore
  # keys match. That entry carries the build cache, with the device framework's compile and link
  # outputs from the latest `main`, so a fresh session does not redo them.
  - uses: gradle/actions/setup-gradle@v4
    env:
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: ios
    with:
      cache-read-only: true

  # The Kotlin/Native distribution and its dependencies -- ~2 GB fetched on a cold box, which
  # is the single longest thing between `start` and a first compile. Restore only, from the
  # entry CI's `ios` job writes: it links the device framework so the iosArm64 per-library
  # caches are in there, which took ~8 minutes of a cold device archive when they were not.
  - uses: actions/cache/restore@v4
    with:
      path: ~/.konan
      key: konan-${{ runner.os }}-device-${{ hashFiles('gradle/libs.versions.toml') }}
      restore-keys: konan-${{ runner.os }}-device-

sync:
  delete: true
  # Everything here is either the runner's own output or Linux-only build state. `.tools` is
  # the libjpeg/libheif prefix build-native.sh produces for linuxX64 -- gigabytes that mean
  # nothing on macOS. The build dirs are excluded so that `--delete` does not wipe the
  # runner's incremental state on every push (see SKILL.md "Traps worth knowing").
  exclude:
    - .git
    - build
    - .gradle
    - .kotlin
    - .tools
    - .cache
    - .build
    - local.properties
