# What this build needs from the JVM, stated where a checkout can see it.
#
# Until this file existed the numbers lived only in one developer's ~/.gradle/gradle.properties,
# so the first machine without that file -- a CI runner -- killed its daemon on
# "GC thrashing / out of JVM Metaspace" partway through `./gradlew build`. Gradle's stock
# daemon is -Xmx512m with 384m of metaspace, and Kotlin Multiplatform, Compose, SQLDelight and
# two Kotlin/Native link tasks do not fit in that.
#
# User-home properties take precedence over this file, so a developer who caps their daemons
# keeps their cap; this is the floor for everyone who has not said otherwise.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# The Kotlin compile daemon is a separate JVM. Unset, it inherits the Gradle daemon's heap and
# the two together overcommit a 16 GB runner.
kotlin.daemon.jvmargs=-Xmx2g

# Task outputs come from the build cache when their inputs match an earlier run's, here or -- on
# CI and in ssh-runner sessions -- a run that setup-gradle carried over from `main`. That makes an
# undeclared input a stale artifact rather than a stale local build, so anything a task reads
# must be one of its inputs: the native prefix's archives, for one, are declared on every link.
org.gradle.caching=true

# Reuse the task graph when nothing that configures it has changed. It also refuses task actions
# that capture the build script, which is why the scripts copy what an action needs into locals.
org.gradle.configuration-cache=true

# Independent modules build at once. The graph is wide -- a JVM, a linuxX64 and two iOS targets
# per module -- and serial execution left a 4-core runner mostly idle through `./gradlew build`.
org.gradle.parallel=true

# A Mac cannot run the linuxX64 tests and executables, and says so once per task at
# configuration time. That is the expected state of a cross-platform build, not news.
kotlin.native.ignoreDisabledTargets=true
